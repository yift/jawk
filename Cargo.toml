[package]
name = "jawk"
version = "0.1.17"
edition = "2024"
license = "MIT"
description = "JSON AWK."
homepage = "https://jawk.ykaplan.me/"
repository = "https://github.com/yift/jawk"
documentation = "https://jawk.ykaplan.me/"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
indexmap = "2.13"
regex = "1.12"
chrono = "0.4"
cached = "0.59"
base64 = "0.22"
bigdecimal = "0.4"
open = "5.3"
clap-markdown = { version = "0.1", optional = true }
mdbook = { version = "0.5", optional = true }
mdbook-driver = { version = "0.5", optional = true }

[features]
default = []
create-docs = ["clap-markdown", "mdbook", "mdbook-driver"]
